name: Build APK - Sensitive Pro

on:
  push:
    branches: [ "main", "arena/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Ensure Gradle Wrapper JAR
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "⚠️ gradle-wrapper.jar missing, trying to download..."
            mkdir -p gradle/wrapper
            # Try multiple sources
            curl -L --retry 3 -o gradle/wrapper/gradle-wrapper.jar https://github.com/gradle/gradle/raw/master/gradle/wrapper/gradle-wrapper.jar || echo "curl github failed"
            if [ ! -f gradle/wrapper/gradle-wrapper.jar ] || [ ! -s gradle/wrapper/gradle-wrapper.jar ]; then
              echo "Downloading via services.gradle.org fallback - generating wrapper"
              gradle wrapper --gradle-version 8.5 || echo "gradle wrapper failed"
            fi
            ls -lh gradle/wrapper/ || true
          else
            echo "✅ Wrapper JAR exists"
            ls -lh gradle/wrapper/
          fi

      - name: Install Android platforms
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true
          yes | sdkmanager --licenses || true

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --info

      - name: Build Release APK (unsigned)
        run: ./gradlew assembleRelease --stacktrace
        continue-on-error: true

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Sensitive-Pro-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Sensitive-Pro-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Show APK info
        if: always()
        run: |
          echo "### 📱 Sensitive Pro APK Build" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**App:** Sensitive Pro (សែនស៊ីធីវ ប្រូ) v1.0.0" >> $GITHUB_STEP_SUMMARY
          echo "**Package:** com.sensitivepro.app" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            SIZE=$(du -h app/build/outputs/apk/debug/app-debug.apk | cut -f1)
            echo "✅ **Debug APK:** \`app-debug.apk\` - $SIZE" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            ls -lh app/build/outputs/apk/debug/ >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Debug APK not found" >> $GITHUB_STEP_SUMMARY
            find app/build -name "*.apk" 2>/dev/null | head -n 20 >> $GITHUB_STEP_SUMMARY || echo "No APKs found" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            SIZE2=$(du -h app/build/outputs/apk/release/app-release-unsigned.apk | cut -f1)
            echo "✅ **Release APK (unsigned):** $SIZE2" >> $GITHUB_STEP_SUMMARY
          fi
