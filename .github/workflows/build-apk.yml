name: Build APK - Sensitive Pro

on:
  push:
    branches: [ "main", "arena/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      upload_keystore:
        description: 'Upload the auto-generated release keystore as an artifact (only used when the RELEASE_KEYSTORE_BASE64 secret is not set)'
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      UPLOAD_KEYSTORE_ARTIFACT: ${{ inputs.upload_keystore }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Validate Gradle Wrapper
        run: |
          echo "=== Gradle wrapper files ==="
          ls -lh gradle/wrapper/
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "::error::gradle-wrapper.jar is missing from the repo. It must be committed to git."
            exit 1
          fi
          python3 - <<'EOF'
          import zipfile, sys
          try:
              z = zipfile.ZipFile('gradle/wrapper/gradle-wrapper.jar')
              names = z.namelist()
              assert any('GradleWrapperMain' in n for n in names), 'GradleWrapperMain not found in jar'
              bad = z.testzip()
              assert bad is None, f'corrupt entry: {bad}'
              print(f'✅ Wrapper JAR valid ({len(names)} entries, GradleWrapperMain present)')
          except Exception as e:
              print(f'::error::gradle-wrapper.jar is invalid: {e}')
              sys.exit(1)
          EOF
          ./gradlew --version --console=plain

      - name: Setup Android SDK (use preinstalled SDK)
        run: |
          echo "ANDROID_HOME: $ANDROID_HOME"
          echo "ANDROID_SDK_ROOT: $ANDROID_SDK_ROOT"
          ls -lh $ANDROID_HOME/cmdline-tools 2>&1 | head -n 20 || true
          ls -lh $ANDROID_HOME/platforms 2>&1 | head -n 20 || true
          # Ensure SDK components are installed (runner already has them, install if missing)
          yes | sdkmanager --licenses 2>&1 | tail -n 20 || true
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools" 2>&1 | tail -n 20 || echo "sdkmanager install attempted"

      # ---------------------------------------------------------------------
      # Signing is what makes the APK installable. An unsigned APK is rejected
      # by the package installer ("App not installed") and flagged as unsafe by
      # Play Protect / Samsung / MIUI.
      #
      # Preferred: add these repository secrets for a STABLE signing identity
      # (required to update the app over an existing install):
      #   RELEASE_KEYSTORE_BASE64 = base64 -w 0 your-keystore.p12
      #   RELEASE_STORE_PASSWORD
      #   RELEASE_KEY_ALIAS
      #   RELEASE_KEY_PASSWORD
      #
      # Fallback: a temporary keystore is generated for this run so the APK is
      # still properly signed and installable (you must uninstall the previous
      # version before installing a build signed with a different key).
      # ---------------------------------------------------------------------
      - name: Prepare release signing
        id: signing
        run: |
          set -euo pipefail
          mkdir -p keystore
          KEYSTORE_PATH="$PWD/keystore/release.p12"

          if [ -n "${RELEASE_KEYSTORE_BASE64:-}" ]; then
            echo "Using keystore from the RELEASE_KEYSTORE_BASE64 secret (stable signing identity)."
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
            : "${RELEASE_STORE_PASSWORD:?RELEASE_STORE_PASSWORD secret is required when RELEASE_KEYSTORE_BASE64 is set}"
            : "${RELEASE_KEY_ALIAS:?RELEASE_KEY_ALIAS secret is required when RELEASE_KEYSTORE_BASE64 is set}"
            cat > keystore.properties <<EOF
          storeFile=keystore/release.p12
          storeType=${RELEASE_STORE_TYPE:-PKCS12}
          storePassword=${RELEASE_STORE_PASSWORD}
          keyAlias=${RELEASE_KEY_ALIAS}
          keyPassword=${RELEASE_KEY_PASSWORD:-$RELEASE_STORE_PASSWORD}
          EOF
            echo "mode=secret" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No RELEASE_KEYSTORE_BASE64 secret - generating a temporary keystore for this run. The APK will be signed and installable, but a build signed with a different key cannot be installed over an existing copy (uninstall first)."
            KS_PASS="ci-$(date +%s)-$RANDOM"
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_PATH" \
              -storetype PKCS12 \
              -alias sensitive-pro \
              -keyalg RSA -keysize 2048 -validity 10950 \
              -storepass "$KS_PASS" -keypass "$KS_PASS" \
              -dname "CN=Sensitive Pro, OU=Mobile, O=Sensitive Pro, L=Phnom Penh, C=KH"
            cat > keystore.properties <<EOF
          storeFile=keystore/release.p12
          storeType=PKCS12
          storePassword=${KS_PASS}
          keyAlias=sensitive-pro
          keyPassword=${KS_PASS}
          EOF
            echo "mode=generated" >> "$GITHUB_OUTPUT"
          fi

          chmod 600 "$KEYSTORE_PATH"
          keytool -list -v -keystore "$KEYSTORE_PATH" \
            -storepass "$(sed -n 's/^storePassword=//p' keystore.properties)" \
            | grep -E "Alias name|Valid|Signature algorithm|SHA256:" || true
          echo "keystore is ready at keystore/release.p12"

        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_STORE_TYPE: ${{ secrets.RELEASE_STORE_TYPE }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Build Debug APK
        id: build_debug
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --console=plain 2>&1 | tee build-debug.log

      - name: Run unit tests (sensitivity data)
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --console=plain 2>&1 | tee build-unittest.log

      - name: Summarise unit tests
        if: always()
        run: |
          python3 - <<'EOF' > build-unittest-summary.txt
          import glob, os, xml.etree.ElementTree as ET
          files = glob.glob('app/build/test-results/testDebugUnitTest/*.xml')
          if not files:
              print('no unit test results found')
              raise SystemExit(0)
          total = failures = errors = skipped = 0
          for f in sorted(files):
              r = ET.parse(f).getroot()
              for suite in ([r] if r.tag == 'testsuite' else r.iter('testsuite')):
                  total += int(suite.get('tests', 0))
                  failures += int(suite.get('failures', 0))
                  errors += int(suite.get('errors', 0))
                  skipped += int(suite.get('skipped', 0))
          print(f'unit tests: {total} run, {failures} failed, {errors} errored, {skipped} skipped')
          for f in sorted(files):
              for case in ET.parse(f).getroot().iter('testcase'):
                  bad = list(case.iter('failure')) + list(case.iter('error'))
                  mark = 'FAIL' if bad else 'pass'
                  print(f'  [{mark}] {case.get("classname")}.{case.get("name")}')
                  for b in bad:
                      print('        ' + (b.get('message') or '').splitlines()[0][:200])
          EOF
          cat build-unittest-summary.txt
          {
            echo ""
            echo "#### 🧪 Unit tests (sensitivity scale)"
            echo '```'
            cat build-unittest-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build Release APK (signed)
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace --console=plain 2>&1 | tee build-release.log

      - name: Verify APK signatures
        if: always()
        run: |
          APKS=$(ls app/build/outputs/apk/release/*.apk app/build/outputs/apk/debug/*.apk 2>/dev/null || true)
          if [ -z "$APKS" ]; then
            echo "No APK produced - nothing to verify."
            exit 0
          fi

          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null || true
          java -version 2>&1 | head -n 2 || echo "java not on PATH"

          # Prefer the build-tools matching compileSdk: newer build-tools can
          # ship an apksigner that needs a newer JRE than the JDK 17 here.
          APKSIGNER=""
          for BT in 34.0.0 35.0.0; do
            if [ -x "$ANDROID_HOME/build-tools/$BT/apksigner" ]; then
              APKSIGNER="$ANDROID_HOME/build-tools/$BT/apksigner"
              break
            fi
          done
          if [ -z "$APKSIGNER" ]; then
            APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | head -n 1 || true)
          fi
          echo "apksigner candidate: ${APKSIGNER:-NONE}"

          : > build-verify.log
          FAILED=0
          for APK in $APKS; do
            echo ""
            echo "===== apksigner verify --verbose --print-certs : $APK ====="
            OUT=""
            RC=0
            if [ -n "$APKSIGNER" ]; then
              OUT=$("$APKSIGNER" verify --verbose --print-certs --min-sdk-version 24 "$APK" 2>&1) || RC=$?
              echo "apksigner exit code: $RC"
              echo "$OUT"
            else
              echo "(apksigner binary not found)"
            fi

            printf '%s\n' "$OUT" >> build-verify.log

            echo ""
            echo "===== structural signature check : $APK ====="
            python3 scripts/check_apk_signature.py "$APK" || FAILED=1

            if [ "$RC" -eq 0 ] && printf '%s' "$OUT" | grep -q "^Verifies"; then
              VERDICT=$(printf '%s' "$OUT" | grep -E "^Verifies|Verified using|^Signer #1 certificate DN" | head -n 6 | sed 's/%/%25/g; s/\r/%0D/g; s/$/%0A/' | tr -d '\n')
              echo "::notice::$(basename "$APK") signature verified -> $VERDICT"
            fi

            if printf '%s' "$OUT" | grep -q "DOES NOT VERIFY"; then
              echo "::error::$APK has an INVALID signature - Android will reject it."
              FAILED=1
            elif [ "$RC" -ne 0 ] && [ -n "$APKSIGNER" ]; then
              # apksigner itself did not run cleanly (tooling, not the APK).
              ESC=$(printf '%s' "$OUT" | tail -n 6 | sed 's/%/%25/g; s/\r/%0D/g; s/$/%0A/' | tr -d '\n')
              echo "::warning::apksigner could not complete for $APK (exit $RC): $ESC"
            fi
          done

          {
            echo ""
            echo "#### 🔎 apksigner verify output"
            echo '```'
            cat build-verify.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$FAILED" -ne 0 ]; then
            echo "::error::APK signature verification failed."
            exit 1
          fi
          echo ""
          echo "✅ All APKs carry a signature."

      - name: Report build failure
        if: failure()
        run: |
          python3 - <<'EOF'
          import re, os

          log_path = 'build-debug.log'
          if not os.path.exists(log_path) and os.path.exists('build-release.log'):
              log_path = 'build-release.log'
          excerpt = ''
          if os.path.exists(log_path):
              with open(log_path, errors='replace') as f:
                  log = f.read()
              # Collect: FAILED tasks, "What went wrong" block, errors, "Caused by" lines
              lines = log.splitlines()
              picked = []
              # 1) FAILED task lines
              for ln in lines:
                  if re.search(r'FAILED|error:|e: ', ln):
                      picked.append(ln)
              # 2) "What went wrong:" section (up to next blank-ish header)
              m = re.search(r'What went wrong:(.*?)(Try:|BUILD FAILED|\Z)', log, re.S)
              if m:
                  picked.append('--- What went wrong: ---')
                  picked.append(m.group(1).strip())
              # 3) Caused by lines
              for ln in lines:
                  if 'Caused by:' in ln:
                      picked.append(ln.strip())
              # 4) Always include tail
              picked.append('--- tail ---')
              picked.extend(lines[-30:])
              # dedupe, drop empties
              seen, out = set(), []
              for ln in picked:
                  s = ln.rstrip()
                  if s and s not in seen:
                      seen.add(s)
                      out.append(s)
              excerpt = '\n'.join(out[-120:])
              if len(excerpt) > 6000:
                  excerpt = excerpt[-6000:]
          else:
              excerpt = 'build logs not found (build step did not produce output).'

          # 1) Print to log
          print('===== BUILD FAILURE EXCERPT =====')
          print(excerpt)
          print('===============================')

          # 2) Step summary (visible in GitHub web UI)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('### ❌ Build failed — error excerpt\n\n```\n')
              f.write(excerpt[:18000])
              f.write('\n```\n')

          # 3) Annotation (visible via API / gh run view)
          esc = excerpt[:6000].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error::Gradle build failed. Excerpt:%0A{esc}')
          EOF

      - name: Comment failure on PR
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ github.head_ref || github.ref_name }}"
          PR=$(gh pr list --head "$BRANCH" --json number --jq '.[0].number // empty' 2>/dev/null || true)
          if [ -z "$PR" ]; then
            echo "No PR found for branch $BRANCH, skipping comment."
            exit 0
          fi
          {
            echo "## ❌ Build failed — [\`run ${{ github.run_id }}\`](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            echo ""
            echo '```'
            for LOG in build-debug.log build-release.log; do
              if [ -f "$LOG" ]; then
                echo "--- $LOG ---"
                grep -E "FAILED|What went wrong|Caused by|error:|e: " "$LOG" | head -n 40
                echo "..."
                tail -n 20 "$LOG"
              fi
            done
            echo '```'
          } > pr-comment.md
          # cap size (~60KB PR comment limit)
          head -c 55000 pr-comment.md > pr-comment-trimmed.md
          mv pr-comment-trimmed.md pr-comment.md
          gh pr comment "$PR" --body-file pr-comment.md || echo "PR comment failed (non-fatal)"

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-logs
          path: |
            build-*.log
            build-unittest-summary.txt
          if-no-files-found: warn

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Sensitive-Pro-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload Release APK (signed)
        uses: actions/upload-artifact@v4
        with:
          name: Sensitive-Pro-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload generated keystore (opt-in, workflow_dispatch only)
        if: always()
        run: |
          if [ "${UPLOAD_KEYSTORE_ARTIFACT:-false}" != "true" ]; then
            echo "Keystore artifact upload not requested."
            exit 0
          fi
          if [ -n "${RELEASE_KEYSTORE_BASE64:-}" ]; then
            echo "RELEASE_KEYSTORE_BASE64 is set - nothing to hand back."
            exit 0
          fi
          cp keystore/release.p12 Sensitive-Pro-keystore.p12 || exit 0
          cp keystore.properties keystore.properties.txt || true
          echo "::warning::The generated keystore + password are being uploaded as an artifact. Store it in the RELEASE_KEYSTORE_BASE64 secret so future builds sign with the same key."

      - name: Upload generated keystore artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sensitive-Pro-keystore
          path: |
            Sensitive-Pro-keystore.p12
            keystore.properties.txt
          if-no-files-found: ignore

      - name: Show APK info
        if: always()
        run: |
          {
            echo "### 📱 Sensitive Pro APK Build"
            echo ""
            echo "**App:** Sensitive Pro (សែនស៊ីធីវ ប្រូ)"
            echo "**Package:** com.sensitivepro.app"
            echo ""
            if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
              SIZE=$(du -h app/build/outputs/apk/debug/app-debug.apk | cut -f1)
              echo "✅ **Debug APK:** \`app-debug.apk\` - $SIZE"
              echo '```'
              ls -lh app/build/outputs/apk/debug/
              echo '```'
            else
              echo "❌ Debug APK not found"
              find app/build -name "*.apk" 2>/dev/null | head -n 20 || echo "No APKs found"
            fi
            echo ""
            for APK in app/build/outputs/apk/release/*.apk; do
              [ -f "$APK" ] || continue
              SIZE2=$(du -h "$APK" | cut -f1)
              echo "✅ **Release APK (signed):** \`$(basename "$APK")\` - $SIZE2"
              echo '```'
              ls -lh app/build/outputs/apk/release/
              echo '```'
            done
            echo ""
            echo "#### 🔐 Signing"
            if [ "${{ steps.signing.outputs.mode }}" = "secret" ]; then
              echo "Signed with the keystore from the \`RELEASE_KEYSTORE_BASE64\` secret — safe to update over an existing install."
            elif [ "${{ steps.signing.outputs.mode }}" = "generated" ]; then
              echo "Signed with a **temporary** keystore generated for this run (no \`RELEASE_KEYSTORE_BASE64\` secret)."
              echo "The APK installs fine, but uninstall the previous version first if it was signed with a different key."
            else
              echo "⚠️ No signing information recorded."
            fi
            echo ""
            echo "> សុវត្ថិភាព: APK ត្រូវបានចុះហត្ថលេខា (v1+v2+v3)។ បើទូរស័ព្ទនៅតែព្រមាន \"App not safe\" ចុច **Install anyway**។"
          } >> "$GITHUB_STEP_SUMMARY"
