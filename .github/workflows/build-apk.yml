name: Build APK - Sensitive Pro

on:
  push:
    branches: [ "main", "arena/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Validate Gradle Wrapper
        run: |
          echo "=== Gradle wrapper files ==="
          ls -lh gradle/wrapper/
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "::error::gradle-wrapper.jar is missing from the repo. It must be committed to git."
            exit 1
          fi
          python3 - <<'EOF'
          import zipfile, sys
          try:
              z = zipfile.ZipFile('gradle/wrapper/gradle-wrapper.jar')
              names = z.namelist()
              assert any('GradleWrapperMain' in n for n in names), 'GradleWrapperMain not found in jar'
              bad = z.testzip()
              assert bad is None, f'corrupt entry: {bad}'
              print(f'✅ Wrapper JAR valid ({len(names)} entries, GradleWrapperMain present)')
          except Exception as e:
              print(f'::error::gradle-wrapper.jar is invalid: {e}')
              sys.exit(1)
          EOF
          ./gradlew --version --console=plain

      - name: Setup Android SDK (use preinstalled SDK)
        run: |
          echo "ANDROID_HOME: $ANDROID_HOME"
          echo "ANDROID_SDK_ROOT: $ANDROID_SDK_ROOT"
          ls -lh $ANDROID_HOME/cmdline-tools 2>&1 | head -n 20 || true
          ls -lh $ANDROID_HOME/platforms 2>&1 | head -n 20 || true
          # Ensure SDK components are installed (runner already has them, install if missing)
          yes | sdkmanager --licenses 2>&1 | tail -n 20 || true
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools" 2>&1 | tail -n 20 || echo "sdkmanager install attempted"

      - name: Build Debug APK
        id: build_debug
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --console=plain 2>&1 | tee build-debug.log

      - name: Build Release APK (unsigned)
        run: ./gradlew assembleRelease --stacktrace --console=plain 2>&1 | tee build-release.log
        continue-on-error: true

      - name: Report build failure
        if: failure()
        run: |
          python3 - <<'EOF'
          import re, os

          log_path = 'build-debug.log'
          excerpt = ''
          if os.path.exists(log_path):
              with open(log_path, errors='replace') as f:
                  log = f.read()
              # Collect: FAILED tasks, "What went wrong" block, errors, "Caused by" lines
              lines = log.splitlines()
              picked = []
              # 1) FAILED task lines
              for ln in lines:
                  if re.search(r'FAILED|error:|e: ', ln):
                      picked.append(ln)
              # 2) "What went wrong:" section (up to next blank-ish header)
              m = re.search(r'What went wrong:(.*?)(Try:|BUILD FAILED|\Z)', log, re.S)
              if m:
                  picked.append('--- What went wrong: ---')
                  picked.append(m.group(1).strip())
              # 3) Caused by lines
              for ln in lines:
                  if 'Caused by:' in ln:
                      picked.append(ln.strip())
              # 4) Always include tail
              picked.append('--- tail ---')
              picked.extend(lines[-30:])
              # dedupe, drop empties
              seen, out = set(), []
              for ln in picked:
                  s = ln.rstrip()
                  if s and s not in seen:
                      seen.add(s)
                      out.append(s)
              excerpt = '\n'.join(out[-120:])
              if len(excerpt) > 6000:
                  excerpt = excerpt[-6000:]
          else:
              excerpt = 'build-debug.log not found (build step did not produce output).'

          # 1) Print to log
          print('===== BUILD FAILURE EXCERPT =====')
          print(excerpt)
          print('===============================')

          # 2) Step summary (visible in GitHub web UI)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('### ❌ Build failed — error excerpt\n\n```\n')
              f.write(excerpt[:18000])
              f.write('\n```\n')

          # 3) Annotation (visible via API / gh run view)
          esc = excerpt[:6000].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error::Gradle build failed. Excerpt:%0A{esc}')
          EOF

      - name: Comment failure on PR
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ github.head_ref || github.ref_name }}"
          PR=$(gh pr list --head "$BRANCH" --json number --jq '.[0].number // empty' 2>/dev/null || true)
          if [ -z "$PR" ]; then
            echo "No PR found for branch $BRANCH, skipping comment."
            exit 0
          fi
          {
            echo "## ❌ Build failed — [\`run ${{ github.run_id }}\`](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            echo ""
            echo '```'
            if [ -f build-debug.log ]; then
              grep -E "FAILED|What went wrong|Caused by|error:|e: " build-debug.log | head -n 60
              echo "..."
              tail -n 20 build-debug.log
            else
              echo "build-debug.log not found."
            fi
            echo '```'
          } > pr-comment.md
          # cap size (~60KB PR comment limit)
          head -c 55000 pr-comment.md > pr-comment-trimmed.md
          mv pr-comment-trimmed.md pr-comment.md
          gh pr comment "$PR" --body-file pr-comment.md || echo "PR comment failed (non-fatal)"

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-logs
          path: build-*.log
          if-no-files-found: warn

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Sensitive-Pro-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Sensitive-Pro-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Show APK info
        if: always()
        run: |
          echo "### 📱 Sensitive Pro APK Build" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**App:** Sensitive Pro (សែនស៊ីធីវ ប្រូ) v1.0.0" >> $GITHUB_STEP_SUMMARY
          echo "**Package:** com.sensitivepro.app" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            SIZE=$(du -h app/build/outputs/apk/debug/app-debug.apk | cut -f1)
            echo "✅ **Debug APK:** \`app-debug.apk\` - $SIZE" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            ls -lh app/build/outputs/apk/debug/ >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Debug APK not found" >> $GITHUB_STEP_SUMMARY
            find app/build -name "*.apk" 2>/dev/null | head -n 20 >> $GITHUB_STEP_SUMMARY || echo "No APKs found" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            SIZE2=$(du -h app/build/outputs/apk/release/app-release-unsigned.apk | cut -f1)
            echo "✅ **Release APK (unsigned):** $SIZE2" >> $GITHUB_STEP_SUMMARY
          fi
